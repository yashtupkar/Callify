<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Voice Agent Testing</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; }
        .controls { margin-bottom: 2rem; display: flex; gap: 1rem; }
        button { padding: 0.75rem 1.5rem; font-size: 1rem; cursor: pointer; border-radius: 4px; border: none; background: #007bff; color: white; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #stopBtn { background: #dc3545; }
        .log-container { background: #f8f9fa; padding: 1rem; border-radius: 4px; height: 400px; overflow-y: auto; border: 1px solid #dee2e6; }
        .log-entry { margin-bottom: 0.5rem; }
        .speaker-user { color: #0056b3; font-weight: bold; }
        .speaker-agent { color: #28a745; font-weight: bold; }
        .config-panel { background: #f1f3f5; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 0.5rem; }
        .form-group input[type="text"], .form-group textarea { width: 100%; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 4px; }
        .form-group textarea { height: 80px; resize: vertical; }
        .checkbox-group { display: flex; gap: 1rem; }
    </style>
</head>
<body>
    <h1>Realtime AI Voice Agent</h1>
    
    <div class="config-panel">
        <h2>Agent Configuration</h2>
        <div class="form-group">
            <label for="firstMessage">First Message (Greeting)</label>
            <input type="text" id="firstMessage" value="Hi, thanks for calling! You’ve reached our reception desk. How can I help you today?">
        </div>
        <div class="form-group">
            <label for="systemPrompt">System Prompt (Persona & Instructions)</label>
            <textarea id="systemPrompt" style="height: 120px;">You are a highly capable, professional, and impressive dental clinic receptionist. Keep your answers natural, engaging, and brief. IMPORTANT RULES: 1. If you receive any specific information from the user (like a name, email, or address), you MUST confirm it back to the user normally to ensure accuracy. 2. NEVER book an appointment without explicitly confirming the exact date and time with the user first. If they only give a time, ask for the date! 3. If the user indicates they want to end the call, or the conversation is naturally over, call the 'end_call' tool to hang up.</textarea>
        </div>
        <div class="form-group">
            <label for="voiceId">Voice ID</label>
            <input type="text" id="voiceId" placeholder="Leave empty for default">
        </div>
        <div class="form-group">
            <label>Data to Collect Before Booking/Ending Call:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" id="collectName" value="Name"> Name</label>
                <label><input type="checkbox" id="collectEmail" value="Email"> Email</label>
                <label><input type="checkbox" id="collectPhone" value="Phone Number"> Phone Number</label>
            </div>
        </div>
        <div class="form-group">
            <label for="customTools">Custom Tools (JSON Array)</label>
            <textarea id="customTools" placeholder='[{"type": "function", "function": {"name": "get_weather", "description": "Get current weather"}}]'></textarea>
        </div>
    </div>

    <div class="controls">
        <button id="startBtn">Start Call</button>
        <button id="stopBtn" disabled>End Call</button>
    </div>

    <div class="log-container" id="transcriptLog">
        <div style="color: #6c757d">Click "Start Call" to begin...</div>
    </div>

    <script src="client.js"></script>
</body>
</html>
